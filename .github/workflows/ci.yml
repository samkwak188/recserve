name: recserve
on:
  push:
  pull_request:

jobs:
  # Sanitizers first: a data race in the RCU snapshot or the parallel HNSW build
  # is the kind of bug that passes every functional test and then corrupts a
  # feature table under load.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [none, address, undefined, thread]
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRECSERVE_SANITIZER=${{ matrix.sanitizer }}
      - name: build
        run: cmake --build build -j 4
      - name: unit tests
        run: ctest --test-dir build --output-on-failure
      - name: quality gate
        run: ./build/recserve_quality --csv data/quality_fixture.csv --k 10
      - name: nearline replay is deterministic
        run: |
          ./build/recserve_nearline --write-log 20000 --items 4096 --out data/events.bin
          A=$(./build/recserve_nearline --replay 20000 --publish-ms 1000 --items 4096 --events data/events.bin)
          B=$(./build/recserve_nearline --replay 20000 --publish-ms 1000 --items 4096 --events data/events.bin)
          echo "$A"
          test "$A" = "$B" || { echo "replay is not deterministic"; exit 1; }
      - name: soak
        run: ./build/recserve_soak --seconds 2 --items 512 --dim 16
      - name: diagnose
        run: ./build/recserve_diagnose --p99 1000 --queue-p99 800 --score-p99 100

  # The index must track the reference implementation, not just "return
  # something". Without this the recall numbers are unfalsifiable.
  index-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install hnswlib numpy
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: recserve vs hnswlib on identical data
        run: python scripts/validate_hnsw.py --items 32768 --dim 64 --clusters 512 --queries 128

  # Agentic change validation: the same machinery the tuner uses, run as a gate.
  # Measures, compares against a stored baseline, and emits a verdict.
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pydantic
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: p99 regression gate
        run: python scripts/perf_ci.py --bench ./build/recserve_bench --baseline /tmp/perf_baseline.json --write-baseline --items 512 --n 150
      - name: agent validate-pr verdict
        run: |
          python scripts/agent.py --validate-pr --items 16384 --dim 64 --clusters 256 \
            --n 400 --trials 3 --recall-probe 32 --baseline /tmp/agent_baseline.json
      - name: agent loop runs end to end without an API key
        # The heuristic, random and grid planners must work with no credentials;
        # the LLM planner falls back to heuristic rather than failing the run.
        run: |
          python scripts/agent.py --planner heuristic --iterations 3 --items 16384 \
            --dim 64 --clusters 256 --n 400 --trials 3 --recall-probe 32 \
            --calibrate-repeats 3 --confirm-repeats 0

  # The Flink job is the offline half of a feature the online path computes
  # incrementally. This asserts the plain-Python reference agrees with the C++
  # online aggregate on the same records, which is what makes the skew number
  # trustworthy on hosts where apache-flink will not install.
  offline-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: online vs offline aggregation agree when fully published
        run: |
          ./build/recserve_nearline --write-log 50000 --items 4096 --out data/events.bin
          # publish-ms 1 flushes essentially everything, so the two sides must
          # agree to the last event; any disagreement here is a real bug, not skew.
          ./build/recserve_nearline --replay 50000 --publish-ms 1 --items 4096 \
            --events data/events.bin --dump-features data/offline/online.csv
          python scripts/offline_ctr.py --events data/events.bin --limit 50000 \
            --out data/offline/offline.csv
          python - <<'PY'
          import csv, sys
          def load(p):
              with open(p) as f:
                  return {int(r["item"]): (int(r["views"]), int(r["likes"])) for r in csv.DictReader(f)}
          on, off = load("data/offline/online.csv"), load("data/offline/offline.csv")
          bad = [i for i in off if on.get(i) != off[i]]
          missing = sum(off[i][0] - on.get(i, (0, 0))[0] for i in bad)
          print(f"items={len(off)} disagreeing={len(bad)} views_missing={missing}")
          # One publish boundary of slack: the replay never flushes the tail.
          if missing > 64:
              sys.exit(f"online/offline aggregation diverged by {missing} views")
          PY
      - name: skew curve
        run: python scripts/skew.py --n 50000 --items 4096 --publish-ms 100 5000

  # End-to-end Kafka: a real broker, a real librdkafka consumer, real offsets.
  # Everything else in this repo runs the nearline path from a file, so without
  # this job the Kafka claim would be untested.
  kafka-integration:
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
        ports: ["9092:9092"]
        options: >-
          --health-cmd "rpk cluster health | grep -q 'Healthy:.*true'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install librdkafka
        run: sudo apt-get update && sudo apt-get install -y librdkafka-dev
      - run: pip install kafka-python
      - name: build with the kafka source
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRECSERVE_WITH_RDKAFKA=ON
          cmake --build build -j 4
      - name: produce
        run: python scripts/kafka_produce.py --broker 127.0.0.1:9092 --n 50000 --rate 25000 --items 4096 --dump /tmp/produced.bin
      - name: consume into the feature snapshot
        run: |
          ./build/recserve_nearline --source kafka --brokers 127.0.0.1:9092 \
            --topic interactions --items 4096 --serve-threads 2 --seconds 10 \
            --publish-ms 100 --json | tee /tmp/kafka.json
          python - <<'PY'
          import json, sys
          d = json.load(open("/tmp/kafka.json"))
          print(json.dumps(d, indent=2))
          if d["source"] != "kafka":
              sys.exit("fell back off the kafka source")
          if d["source_errors"]:
              sys.exit(f"{d['source_errors']} decode errors on the topic")
          # The whole 50k topic must be drained. Before the lag refresh was moved
          # off the hot path this consumed ~11k of 50k and reported the backlog it
          # had caused itself as consumer lag.
          if d["ingested"] < 49000:
              sys.exit(f"consumed only {d['ingested']} of 50000 records")
          # Deliberately NOT asserting on ingest_eps: the consumer drains the
          # backlog in the first couple of seconds and then idles, so the mean
          # over a 10 s window understates throughput. Draining the topic and
          # ending at near-zero lag is the assertion that means something.
          # Freshness must be a real measurement. It read exactly 0 while the
          # consumer compared a steady_clock reading against the producer's
          # wall-clock stamp, so 0 is the failure signature, not a good result.
          if not (0 < d["freshness_p99_ms"] < 60000):
              sys.exit(f"freshness_p99_ms={d['freshness_p99_ms']} is not a real measurement")
          if d["consumer_lag"] > 100:
              sys.exit(f"consumer lag {d['consumer_lag']} left unconsumed")
          print("kafka path verified: drained the topic, freshness and lag are real")
          PY

  # Runs the actual Flink job on a real Flink runtime against a real broker, and
  # asserts its output equals the independent Python reference on byte-identical
  # records. Without this the Flink job is a file, not a capability.
  flink-job:
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
        ports: ["9092:9092"]
        options: >-
          --health-cmd "rpk cluster health | grep -q 'Healthy:.*true'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: install pyflink and the kafka connector
        run: |
          pip install "apache-flink==1.20.0" kafka-python
          curl -fsSLO https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.3.0-1.20/flink-sql-connector-kafka-3.3.0-1.20.jar
          ls -l flink-sql-connector-kafka-3.3.0-1.20.jar
      - name: produce the same records to kafka and to a file
        run: |
          python scripts/kafka_produce.py --broker 127.0.0.1:9092 --n 20000             --rate 20000 --items 2048 --dump /tmp/flink_events.bin
      - name: run the flink job
        run: |
          python flink/ctr_aggregate.py --brokers 127.0.0.1:9092             --jar file://$PWD/flink-sql-connector-kafka-3.3.0-1.20.jar             --out data/offline/flink_ctr
      - name: python reference over the identical records
        run: |
          python scripts/offline_ctr.py --events /tmp/flink_events.bin             --out data/offline/offline_ctr.csv
      - name: flink output must equal the reference exactly
        run: |
          python scripts/compare_flink.py --flink data/offline/flink_ctr             --reference data/offline/offline_ctr.csv

  # Real embeddings, not synthetic vectors. Trains ALS on MovieLens, serves the
  # item factors through the actual request path, and cross-checks the C++
  # result against an independent numpy implementation. Without this the recall
  # numbers describe high-dimensional geometry rather than recommendation
  # quality, and nothing verifies that the serving path computes what the
  # offline evaluation thinks it computes.
  quality-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy implicit pandas certifi
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: train ALS on movielens
        run: python scripts/prep_movielens.py --dataset small --factors 32 --iterations 15
      - name: build an index over the trained catalog
        run: |
          ./build/recserve_fixture --in-catalog data/mlsmall_catalog.bin             --out-index data/mlsmall_index.bin --m 16 --ef-construction 200 --build-threads 1
      - name: baselines and C++/numpy cross-check
        # The exact-scan path must reproduce numpy to within 0.002 recall. A
        # mismatch means the service is not computing what the evaluation says.
        run: python scripts/eval_baselines.py --prefix mlsmall --k 10 --max-cpp-delta 0.002
      - name: HNSW must find nearly all of the exact top-k on real embeddings
        run: |
          ./build/recserve_eval --catalog data/mlsmall_catalog.bin             --queries data/mlsmall_queries.bin --test data/mlsmall_test.csv             --train data/mlsmall_train.csv --index data/mlsmall_index.bin             --k 10 --ef 64 --json | tee /tmp/quality.json
          python - <<'PY'
          import json, sys
          d = json.load(open("/tmp/quality.json"))
          print(json.dumps(d, indent=2))
          # Real embedding tables have low intrinsic dimension, so the graph
          # should find essentially all of the exact top-k at a modest ef. On
          # synthetic uniform vectors the same ef reaches barely half.
          if d["retrieve_recall"] < 0.95:
              sys.exit(f"retrieve_recall {d['retrieve_recall']:.4f} < 0.95 on real embeddings")
          PY
