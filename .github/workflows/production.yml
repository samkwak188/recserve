name: production-pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-production.lock
      - run: pip install --require-hashes -r requirements-production.lock
      - run: python scripts/production_runner.py --stage integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-integration-receipts
          path: .cache/production/runs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-production.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install --require-hashes -r requirements-production.lock
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python scripts/production_runner.py --stage browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-evidence
          path: |
            .cache/production/runs
            .cache/production/browser/*/report.json
            .cache/production/browser/*/*.png
            .cache/production/browser/*/services.log
