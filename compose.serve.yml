services:
  recserve:
    build: .
    image: recserve:local
    ports:
      - "127.0.0.1:9400:9400"
    volumes:
      - ./data:/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 4
    stop_grace_period: 15s
