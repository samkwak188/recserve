global:
  scrape_interval: 15s
  scrape_timeout: 6s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: recserve-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: [web:9000]
  - job_name: recserve-https
    metrics_path: /probe
    params:
      module: [https_ready]
    file_sd_configs:
      - files: [/etc/prometheus/https-targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
